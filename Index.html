<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Login-Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="container">
        <form class="login-card">
            <h1 class="login-heading">Login</h1>

            <label class="login-label" for="username">Username</label>
            <input class="input-box" type="text" id="username" name="username" placeholder="Enter your username" required>

            <label class="login-label" for="password">Password</label>
            <input class="input-box" type="password" id="password" name="password" placeholder="Enter your password" required>

            <button class="login-button" type="submit">Login</button>
            <p class="signup-link">Don't have an account? <a href="signup.html">Sign up</a></p>
                <div class="social-login">
                    <a href="">
                        <div class="google-login">
                        <i class="fa-brands fa-google"></i>
                        </div></a>

                    <a href="">
                        <div class="facebook-login">
                            <i class="fa-brands fa-facebook"></i>
                        </div></a>

                    <a href="">
                        <div class="twitter-login">
                            <i class="fa-brands fa-twitter"></i>
                        </div></a>
                    
                </div>
        </form>
    </div>
</body>
</html><a hr
